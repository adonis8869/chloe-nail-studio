<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chloe Selection | 嚴選團購</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { 'brand-bg': '#F5F0F0', 'brand-text': '#8B7E74', 'brand-accent': '#C5A086', 'brand-dark': '#5D534A' }, fontFamily: { 'sans': ['"Zen Maru Gothic"'], 'serif': ['"Zen Maru Gothic"'], 'hand': ['"Dancing Script"'] } } } }
        
        // ▼▼▼▼▼ 商品設定區 (請修改名稱與價格) ▼▼▼▼▼
        const SHOP_CONFIG = {
            // 請將LINE ID換成您美甲店的正確ID (不含@)
            lineID: "866wnpdc", 
            
            products: [
                { id: 1, name: "團購好物 01", price: 390, tag: "熱銷", image: "p01.jpg" },
                { id: 2, name: "團購好物 02", price: 450, tag: "推薦", image: "p02.jpg" },
                { id: 3, name: "團購好物 03", price: 280, tag: "", image: "p03.jpg" },
                { id: 4, name: "團購好物 04", price: 590, tag: "", image: "p04.jpg" },
                { id: 5, name: "團購好物 05", price: 350, tag: "", image: "p05.jpg" },
                { id: 6, name: "團購好物 06", price: 420, tag: "", image: "p06.jpg" },
                { id: 7, name: "團購好物 07", price: 390, tag: "現貨", image: "p07.jpg" },
                { id: 8, name: "團購好物 08", price: 890, tag: "精選", image: "p08.jpg" },
                { id: 9, name: "團購好物 09", price: 250, tag: "", image: "p09.jpg" },
                { id: 10, name: "團購好物 10", price: 300, tag: "", image: "p10.jpg" },
                { id: 11, name: "團購好物 11", price: 480, tag: "限定", image: "p11.jpg" }
            ]
        };
        // ▲▲▲▲▲ 設定結束 ▲▲▲▲▲
    </script>
    <style>
        body { background-color: #F5F0F0; color: #8B7E74; font-family: "Zen Maru Gothic", sans-serif; }
        .zoomable:hover { transform: scale(1.02); transition: 0.3s; cursor: zoom-in; }
        
        /* Modal & Overlay */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 90; display: none; }
        .modal-overlay.show { display: block; }
        
        /* Cart Sidebar */
        #cart-sidebar { position: fixed; top: 0; right: 0; width: 100%; max-width: 400px; height: 100%; background: white; z-index: 100; transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; box-shadow: -5px 0 25px rgba(0,0,0,0.1); }
        #cart-sidebar.open { transform: translateX(0); }

        /* Product Modal */
        #product-modal { 
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: 90%; max-width: 800px; max-height: 90vh; background: white; z-index: 100; 
            border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); overflow: hidden;
            flex-direction: column; 
        }
        #product-modal.open { display: flex; }
        @media (min-width: 768px) { #product-modal { flex-direction: row; } }

        /* Floating Button */
        .cart-float-btn { position: fixed; bottom: 90px; right: 20px; background: #C5A086; color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); cursor: pointer; z-index: 50; transition: 0.2s; }
        .cart-count { position: absolute; top: -5px; right: -5px; background: #b91c1c; color: white; font-size: 12px; width: 24px; height: 24px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; }
        @media (min-width: 768px) { .cart-float-btn { bottom: 30px; right: 30px; } }
        
        /* Lightbox */
        #lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 9999; justify-content: center; align-items: center; }
        #lightbox.show { display: flex; } #lightbox img { max-width: 100%; max-height: 95vh; object-fit: contain; }
    </style>
</head>
<body class="pb-24 md:pb-0">
    
    <div id="overlay" class="modal-overlay" onclick="closeAllModals()"></div>
    <div id="lightbox" onclick="this.classList.remove('show')"><img id="lightbox-img" src=""></div>

    <div id="product-modal">
        <button onclick="closeAllModals()" class="absolute top-2 right-2 md:top-4 md:right-4 z-20 bg-black/20 hover:bg-black/40 rounded-full p-2 text-white transition">✕</button>
        
        <div class="w-full md:w-1/2 bg-gray-50 p-4 md:p-6 flex items-center justify-center overflow-hidden h-64 md:h-full shrink-0 border-b md:border-b-0 md:border-r border-gray-100">
            <img id="pm-image" src="" class="max-w-full max-h-full object-contain cursor-zoom-in rounded-lg shadow-sm" onclick="openLightbox(this.src)">
        </div>

        <div class="w-full md:w-1/2 p-6 md:p-10 flex flex-col h-full overflow-y-auto bg-white justify-center">
            <div class="flex-1 flex flex-col justify-center">
                <div id="pm-tag" class="inline-block bg-brand-dark text-white text-xs px-2 py-1 rounded mb-2 w-fit" style="display:none">預購</div>
                <h2 id="pm-title" class="text-3xl font-bold text-brand-dark mb-2">商品名稱</h2>
                <p id="pm-price" class="text-2xl text-brand-accent font-bold mb-6">$0</p>
                
                <div class="space-y-6">
                    <div class="bg-brand-bg/30 p-4 rounded-lg border border-brand-bg">
                        <label class="block text-sm font-bold text-gray-600 mb-3">購買數量</label>
                        <div class="flex items-center">
                            <button onclick="adjustQty(-1)" class="w-12 h-12 bg-white border border-gray-300 rounded-l hover:bg-gray-100 text-xl font-bold text-gray-500 transition">-</button>
                            <input type="number" id="pm-qty" value="1" readonly class="w-20 h-12 text-center text-xl text-brand-dark font-bold border-t border-b border-gray-300 outline-none bg-white">
                            <button onclick="adjustQty(1)" class="w-12 h-12 bg-white border border-gray-300 rounded-r hover:bg-gray-100 text-xl font-bold text-brand-accent transition">+</button>
                        </div>
                    </div>
                </div>
            </div>
            <button onclick="confirmAddToCart()" class="w-full bg-brand-text text-white py-4 rounded-lg hover:bg-brand-accent transition font-bold text-xl shadow-lg mt-8 mb-4">加入購物車</button>
        </div>
    </div>

    <div id="cart-sidebar">
        <div class="p-5 border-b flex justify-between items-center bg-brand-bg"><h3 class="text-xl font-bold text-brand-dark">購物車</h3><button onclick="closeAllModals()" class="text-gray-500 text-2xl">×</button></div>
        <div class="flex-1 overflow-y-auto p-5 space-y-4" id="cart-items"><div class="text-center text-gray-400 mt-10">購物車是空的</div></div>
        <div class="p-5 border-t bg-gray-50">
            <div class="space-y-3 mb-4 text-sm">
                <div class="flex justify-between"><span>商品小計</span><span id="cart-subtotal">$0</span></div>
                <div class="flex flex-col gap-2 border-b pb-2">
                    <span class="font-bold text-brand-dark">選擇運費：</span>
                    <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="shipping" value="60" checked onchange="updateCartTotal()"><span>7-11 店到店 (+$60)</span></label>
                    <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="shipping" value="130" onchange="updateCartTotal()"><span>黑貓宅急便 (+$130)</span></label>
                    <div class="flex justify-between text-gray-500 text-xs"><span>運費金額</span><span id="shipping-fee-display">$60</span></div>
                </div>
                <div class="flex justify-between text-lg font-bold text-brand-accent pt-2"><span>總金額</span><span id="cart-total">$0</span></div>
            </div>
            <div class="space-y-2 mb-4"><input type="text" id="c-name" placeholder="您的姓名" class="w-full p-2 border rounded text-sm"><input type="tel" id="c-phone" placeholder="聯絡電話" class="w-full p-2 border rounded text-sm"><input type="text" id="c-store" placeholder="取件門市名稱 / 宅配地址" class="w-full p-2 border rounded text-sm"></div>
            <button onclick="checkout()" class="w-full bg-brand-accent text-white py-3 rounded hover:bg-brand-dark transition font-bold tracking-widest">LINE 傳送訂單</button>
        </div>
    </div>

    <div class="cart-float-btn" onclick="openCart()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-8 h-8"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.356-1.993l1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 01-1.12-1.243l1.264-12A1.125 1.125 0 015.513 7.5h12.974c.576 0 1.059.435 1.119 1.007zM8.625 10.5a.375.375 0 11-.75 0 .375.375 0 01.75 0zm7.5 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" /></svg>
        <div class="cart-count" id="cart-count" style="display:none">0</div>
    </div>

    <nav class="hidden md:flex fixed w-full z-40 bg-brand-bg/95 backdrop-blur-sm border-b border-brand-accent/20 py-5 justify-center items-center text-brand-text font-medium shadow-sm">
        <div class="text-center px-4">
            <div class="text-2xl font-bold tracking-widest font-serif">CHLOE SELECTION</div>
            <div class="font-hand text-lg text-brand-accent">Chloe Nail Studio</div>
        </div>
    </nav>
    <div class="md:hidden text-center py-4 bg-brand-bg border-b border-brand-accent/20 sticky top-0 z-40 shadow-sm/50 backdrop-blur-md bg-opacity-90">
        <div class="text-xl font-bold text-brand-text tracking-widest font-serif">CHLOE SELECTION</div>
        <div class="font-hand text-sm text-brand-accent">Chloe Nail Studio</div>
    </div>

    <div class="pt-20 md:pt-32 pb-12 px-4 max-w-7xl mx-auto">
        <div id="shop" class="text-center mb-12">
            <h2 class="text-3xl md:text-4xl text-brand-text font-bold">Group Buy</h2>
            <p class="font-hand text-2xl text-brand-accent">Chloe 嚴選團購</p>
            <div class="mt-6 inline-block bg-brand-bg px-6 py-4 rounded-lg border border-brand-accent/20 shadow-sm mb-8">
                <p class="text-brand-dark font-bold text-lg mb-1">🎉 全館滿 $3000 免運費</p>
            </div>
            <div class="flex justify-center mt-4">
                <a href="#" onclick="openLine()" class="flex items-center justify-center gap-2 bg-brand-text text-white px-10 py-3 rounded hover:bg-brand-accent transition font-bold shadow-md">💬 官方 LINE 諮詢</a>
            </div>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 pb-12" id="shop-container"></div>
    </div>

    <div class="md:hidden fixed bottom-0 left-0 w-full bg-white border-t border-brand-accent/20 z-30 flex justify-around items-end py-2 px-2 text-[10px] text-brand-text shadow">
        <a href="#" class="flex flex-col items-center p-2 text-brand-accent font-bold"><span class="text-lg mb-1">🛍️</span><span>團購</span></a>
        <div class="relative flex flex-col items-center -top-5 cursor-pointer" onclick="openCart()">
            <div class="bg-brand-accent text-white rounded-full w-14 h-14 flex items-center justify-center shadow-lg shadow-brand-accent/40"><span class="text-2xl">🛒</span></div>
            <span class="font-bold text-brand-accent mt-1">購物車</span>
        </div>
        <a href="#" onclick="openLine()" class="flex flex-col items-center p-2"><span class="text-lg mb-1">💬</span><span>客服</span></a>
    </div>

    <script>
        // 1. 渲染商品
        document.getElementById('shop-container').innerHTML = SHOP_CONFIG.products.map(p => `
            <div class="group cursor-pointer" onclick="openProductModal(${p.id})">
                <div class="relative overflow-hidden rounded-lg shadow-sm mb-4">
                    <img src="${p.image}" class="w-full h-72 object-cover group-hover:scale-105 transition duration-500" onerror="this.src='default.jpg'">
                    ${p.tag?`<div class="absolute top-2 right-2 bg-brand-dark text-white text-xs px-2 py-1 rounded">${p.tag}</div>`:''}
                    <div class="absolute bottom-0 left-0 w-full bg-black/50 text-white text-center py-2 opacity-0 group-hover:opacity-100 transition">點擊查看詳情</div>
                </div>
                <h3 class="text-lg font-bold text-brand-dark">${p.name}</h3>
                <p class="text-brand-accent text-xl">${p.price===0?'私訊後報價':'$'+p.price}</p>
            </div>`).join('');

        // 2. 詳情頁 Modal 邏輯
        let currentProduct = null;

        function openProductModal(pid) {
            currentProduct = SHOP_CONFIG.products.find(p => p.id === pid);
            if(!currentProduct) return;

            document.getElementById('pm-image').src = currentProduct.image;
            document.getElementById('pm-image').onerror = function() { this.src='default.jpg'; };
            document.getElementById('pm-title').innerText = currentProduct.name;
            document.getElementById('pm-price').innerText = currentProduct.price === 0 ? '私訊後報價' : '$' + currentProduct.price;
            
            const tagEl = document.getElementById('pm-tag');
            if(currentProduct.tag) {
                tagEl.innerText = currentProduct.tag;
                tagEl.style.display = 'inline-block';
            } else {
                tagEl.style.display = 'none';
            }

            // 重置數量
            document.getElementById('pm-qty').value = 1;
            
            document.getElementById('overlay').classList.add('show');
            document.getElementById('product-modal').classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        // 調整數量
        function adjustQty(delta) {
            const input = document.getElementById('pm-qty');
            let val = parseInt(input.value) + delta;
            if(val < 1) val = 1;
            if(val > 50) val = 50; 
            input.value = val;
        }

        function closeAllModals() {
            document.getElementById('overlay').classList.remove('show');
            document.getElementById('product-modal').classList.remove('open');
            const cartSidebar = document.getElementById('cart-sidebar');
            if (cartSidebar) cartSidebar.classList.remove('open');
            document.body.style.overflow = ''; 
        }

        function openLightbox(src) {
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox').classList.add('show');
        }

        // 3. 購物車邏輯
        let cart = [];
        function openCart() {
            document.getElementById('overlay').classList.add('show');
            document.getElementById('cart-sidebar').classList.add('open');
            document.body.style.overflow = 'hidden';
        }
        
        function confirmAddToCart() {
            if(!currentProduct) return;
            const qtyVal = parseInt(document.getElementById('pm-qty').value);
            
            const uid = currentProduct.id; // 不分尺寸，直接用ID當key
            const item = cart.find(i => i.id === uid);

            if(item) {
                item.qty += qtyVal;
            } else {
                cart.push({
                    uid: uid,
                    id: currentProduct.id,
                    name: currentProduct.name,
                    base: currentProduct.price,
                    img: currentProduct.image,
                    qty: qtyVal
                });
            }

            closeAllModals();
            updateCart();
            openCart();
        }
        
        function removeFromCart(uid){ cart = cart.filter(i=>i.uid!==uid); updateCart(); }
        
        function updateCart() {
            const sub = cart.reduce((s,i)=>s+i.base*i.qty,0);
            const qty = cart.reduce((s,i)=>s+i.qty,0);
            
            let ship = parseInt(document.querySelector('input[name="shipping"]:checked').value);
            let sText = "$"+ship;
            if(sub >= 3000){ ship=0; sText="滿額免運 ($0)"; }
            document.getElementById('shipping-fee-display').innerText = sText;
            
            document.getElementById('cart-subtotal').innerText = '$'+sub;
            document.getElementById('cart-total').innerText = '$'+(sub+ship);
            document.getElementById('cart-count').innerText = qty;
            document.getElementById('cart-count').style.display = qty?'flex':'none';
            
            document.getElementById('cart-items').innerHTML = cart.length ? cart.map(i=>`
                <div class="flex gap-3 items-center bg-gray-50 p-2 rounded border">
                    <img src="${i.img}" class="w-14 h-14 object-cover rounded" onerror="this.src='default.jpg'">
                    <div class="flex-1">
                        <div class="text-sm font-bold text-brand-dark">${i.name}</div>
                        <div class="text-brand-accent">${i.base===0?'私訊後報價':'$'+i.base+' x '+i.qty}</div>
                    </div>
                    <button onclick="removeFromCart(${i.id})" class="text-gray-400 hover:text-red-500 p-2">×</button>
                </div>`).join('') : '<div class="text-center text-gray-400 mt-10">購物車是空的</div>';
        }

        function updateCartTotal() { updateCart(); }

        function openLine() {
             window.open(`https://line.me/R/ti/p/@${SHOP_CONFIG.lineID}`, '_blank');
        }

        function checkout() {
            if(!/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) { alert("⚠️ 建議使用手機下單，以確保 LINE 訊息格式正確！"); }
            if(cart.length===0) return alert('購物車是空的');
            const n=document.getElementById('c-name').value, p=document.getElementById('c-phone').value, s=document.getElementById('c-store').value;
            if(!n||!p||!s) return alert('請填寫完整資料');
            
            let msg = `您好，我想跟團訂購：\n`;
            cart.forEach((i,idx)=> msg += `${idx+1}. ${i.name}\n   數量：${i.qty} (單價${i.base===0?'私訊':i.base})\n`);
            const sub = cart.reduce((s,i)=>s+i.base*i.qty,0);
            
            let shipName = document.querySelector('input[name="shipping"]:checked').nextElementSibling.innerText;
            let ship = parseInt(document.querySelector('input[name="shipping"]:checked').value);
            if(sub >= 3000){ ship=0; shipName+=" [免運]"; }
            
            msg += `------------------\n商品小計：$${sub}\n`;
            msg += `運費 (${shipName})：$${ship}\n總金額：$${sub+ship}\n------------------\n【寄送資訊】\n姓名：${n}\n電話：${p}\n地址：${s}`;
            
            // 使用美甲店官方LINE ID
            window.open(`https://line.me/R/oaMessage/@${SHOP_CONFIG.lineID}/?${encodeURIComponent(msg)}`, '_blank');
        }
    </script>
</body>
</html>
