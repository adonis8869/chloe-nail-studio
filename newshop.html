                document.getElementById('pm-price-container').innerHTML = formatPriceHTML(currentProduct.price, currentProduct.originalPrice).replace('text-sm', 'text-lg').replace('text-brand-accent', 'text-brand-accent text-3xl');
            }

            document.getElementById('pm-qty').value = 1;
            document.getElementById('pm-error-msg').classList.add('hidden');
            document.getElementById('add-to-cart-btn').classList.remove('opacity-50', 'cursor-not-allowed');
            
            document.getElementById('overlay').classList.add('show');
            document.getElementById('product-modal').classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        // ★ 渲染客製化選項 UI
        function renderCustomOptions() {
            const v = currentProduct.variants;
            const currentType = v.types[currentVariantIndex];
            
            // 1. 更新價格顯示
            document.getElementById('pm-price-container').innerHTML = `<span class="text-brand-accent text-3xl font-bold">$${currentType.price}</span>`;

            // 2. 生成 HTML
            let html = `
                <div class="bg-brand-bg/30 p-4 rounded-lg border border-brand-bg mb-4">
                    <label class="block text-sm font-bold text-gray-600 mb-2">1. 選擇規格</label>
                    <div class="flex gap-2">
                        ${v.types.map((type, idx) => `
                            <div onclick="switchVariant(${idx})" class="option-btn flex-1 text-center ${idx === currentVariantIndex ? 'active' : ''}">
                                ${type.name}
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div class="bg-brand-bg/30 p-4 rounded-lg border border-brand-bg">
                    <label class="block text-sm font-bold text-gray-600 mb-2">
                        2. 選擇香味 (需選 ${currentType.count} 個)
                        <span id="scent-status" class="text-xs font-normal ml-2 text-brand-accent">目前已選: 0</span>
                    </label>
                    <div class="space-y-3">
                        ${v.scents.map(scent => `
                            <div class="flex justify-between items-center">
                                <span class="text-sm text-gray-700">${scent}</span>
                                <div class="scent-counter flex items-center">
                                    <button onclick="updateScent('${scent}', -1)">-</button>
                                    <input type="text" value="${selectedScents[scent] || 0}" readonly>
                                    <button onclick="updateScent('${scent}', 1)">+</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            document.getElementById('pm-custom-options').innerHTML = html;
            validateScents(); // 檢查狀態
        }

        // ★ 切換規格 (單入/禮盒)
        function switchVariant(index) {
            currentVariantIndex = index;
            // 清空已選香味，避免混亂
            Object.keys(selectedScents).forEach(k => selectedScents[k] = 0);
            renderCustomOptions();
        }

        // ★ 更新香味數量
        function updateScent(scent, delta) {
            const targetCount = currentProduct.variants.types[currentVariantIndex].count;
            const currentTotal = Object.values(selectedScents).reduce((a, b) => a + b, 0);
            
            // 檢查是否超過上限
            if (delta > 0 && currentTotal >= targetCount) return; // 不能再加了
            
            const newVal = (selectedScents[scent] || 0) + delta;
            if (newVal < 0) return; // 不能小於 0

            selectedScents[scent] = newVal;
            renderCustomOptions();
        }

        // ★ 驗證香味數量是否正確
        function validateScents() {
            if (!currentProduct.variants) return true;
            
            const targetCount = currentProduct.variants.types[currentVariantIndex].count;
            const currentTotal = Object.values(selectedScents).reduce((a, b) => a + b, 0);
            
            const statusText = document.getElementById('scent-status');
            const btn = document.getElementById('add-to-cart-btn');
            const errorMsg = document.getElementById('pm-error-msg');

            if (statusText) statusText.innerText = `目前已選: ${currentTotal} / ${targetCount}`;

            if (currentTotal === targetCount) {
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
                btn.disabled = false;
                errorMsg.classList.add('hidden');
                if(statusText) statusText.classList.replace('text-red-500', 'text-brand-accent');
                return true;
            } else {
                btn.classList.add('opacity-50', 'cursor-not-allowed');
                btn.disabled = true;
                errorMsg.classList.remove('hidden');
                if(statusText) statusText.classList.replace('text-brand-accent', 'text-red-500');
                return false;
            }
        }

        function changeMainImage(src) {
            const mainImg = document.getElementById('pm-image');
            mainImg.src = src;
            mainImg.onerror = function() { this.src='default.jpg'; };
            document.querySelectorAll('.thumb-img').forEach(img => {
                img.classList.remove('active', 'border-brand-accent', 'opacity-100');
                if(img.src.includes(src)) {
                    img.classList.add('active', 'border-brand-accent', 'opacity-100');
                }
            });
        }

        function adjustQty(delta) {
            const input = document.getElementById('pm-qty');
            let val = parseInt(input.value) + delta;
            if(val < 1) val = 1;
            if(val > 50) val = 50; 
            input.value = val;
        }

        function closeAllModals() {
            document.getElementById('overlay').classList.remove('show');
            document.getElementById('product-modal').classList.remove('open');
            const cartSidebar = document.getElementById('cart-sidebar');
            if (cartSidebar) cartSidebar.classList.remove('open');
            document.body.style.overflow = ''; 
        }

        function openLightbox(src) {
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox').classList.add('show');
        }

        let cart = [];
        function openCart() {
            document.getElementById('overlay').classList.add('show');
            document.getElementById('cart-sidebar').classList.add('open');
            document.body.style.overflow = 'hidden';
        }
        
        function confirmAddToCart() {
            if(!currentProduct) return;
            
            // ★ 如果是客製化商品，檢查是否選完
            if (currentProduct.variants && !validateScents()) {
                return; // 驗證未通過，不給加
            }

            const qtyVal = parseInt(document.getElementById('pm-qty').value);
            let finalName = currentProduct.name;
            let finalPrice = currentProduct.price;
            let customNote = "";

            // ★ 處理客製化內容
            if (currentProduct.variants) {
                const typeObj = currentProduct.variants.types[currentVariantIndex];
                finalPrice = typeObj.price;
                finalName = `${currentProduct.name} - ${typeObj.name}`;
                
                // 組合香味字串
                const scentStr = Object.entries(selectedScents)
                    .filter(([k, v]) => v > 0)
                    .map(([k, v]) => `${k} x${v}`)
                    .join(", ");
                customNote = `[香味: ${scentStr}]`;
            }

            // 產生唯一 ID (如果是客製化，要把選項也算進去，避免不同香味被合併)
            const uid = currentProduct.variants ? 
                `${currentProduct.id}-${currentVariantIndex}-${customNote}` : 
                currentProduct.id;

            const item = cart.find(i => i.uid === uid);

            if(item) {
                item.qty += qtyVal;
            } else {
                cart.push({
                    uid: uid, // 使用新的 UID
                    id: currentProduct.id,
                    name: finalName + (customNote ? `\n   ${customNote}` : ""), // 顯示在購物車的名字
                    base: finalPrice, 
                    img: currentProduct.images[0],
                    qty: qtyVal
                });
            }
            closeAllModals();
            updateCart();
            openCart();
        }
        
        function removeFromCart(uid){ cart = cart.filter(i=>i.uid!==uid); updateCart(); }
        
        function updateCart() {
            const sub = cart.reduce((s,i)=>s+i.base*i.qty,0);
            const qty = cart.reduce((s,i)=>s+i.qty,0);
            
            let ship = parseInt(document.querySelector('input[name="shipping"]:checked').value);
            let sText = "$"+ship;
            
            document.getElementById('shipping-fee-display').innerText = sText;
            document.getElementById('cart-subtotal').innerText = '$'+sub;
            document.getElementById('cart-total').innerText = '$'+(sub+ship);
            document.getElementById('cart-count').innerText = qty;
            document.getElementById('cart-count').style.display = qty?'flex':'none';
            
            document.getElementById('cart-items').innerHTML = cart.length ? cart.map(i=>`
                <div class="flex gap-3 items-center bg-gray-50 p-2 rounded border">
                    <img src="${i.img}" class="w-14 h-14 object-cover rounded" onerror="this.src='default.jpg'">
                    <div class="flex-1">
                        <div class="text-sm font-bold text-brand-dark whitespace-pre-line">${i.name}</div>
                        <div class="text-brand-accent">${i.base===0?'私訊後報價':'$'+i.base+' x '+i.qty}</div>
                    </div>
                    <button onclick="removeFromCart('${i.uid}')" class="text-gray-400 hover:text-red-500 p-2">×</button>
                </div>`).join('') : '<div class="text-center text-gray-400 mt-10">購物車是空的</div>';
        }

        function updateCartTotal() { updateCart(); }

        function openLine() {
             window.open(`https://line.me/R/ti/p/@${SHOP_CONFIG.lineID}`, '_blank');
        }

        function checkout() {
            if(!/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) { alert("⚠️ 建議使用手機下單，以確保 LINE 訊息格式正確！"); }
            if(cart.length===0) return alert('購物車是空的');
            const n=document.getElementById('c-name').value, p=document.getElementById('c-phone').value, s=document.getElementById('c-store').value;
            if(!n||!p||!s) return alert('請填寫完整資料');
            
            let msg = `您好，我想跟團訂購：\n`;
            cart.forEach((i,idx)=> msg += `${idx+1}. ${i.name}\n   數量：${i.qty} (單價${i.base===0?'私訊':i.base})\n`);
            const sub = cart.reduce((s,i)=>s+i.base*i.qty,0);
            
            let shipName = document.querySelector('input[name="shipping"]:checked').nextElementSibling.innerText.trim();
            let ship = parseInt(document.querySelector('input[name="shipping"]:checked').value);
            
            msg += `------------------\n商品小計：$${sub}\n`;
            msg += `運費 (${shipName})：$${ship}\n總金額：$${sub+ship}\n------------------\n【訂購資訊】\n姓名：${n}\n電話：${p}\n備註/門市：${s}`;
            
            window.open(`https://line.me/R/oaMessage/@${SHOP_CONFIG.lineID}/?${encodeURIComponent(msg)}`, '_blank');
        }
    </script>
</body>
</html>
