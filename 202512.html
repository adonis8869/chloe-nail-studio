<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chloe Nail Studio | 設計師作品集</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 
                        'brand-bg': '#F5F0F0', 
                        'brand-text': '#8B7E74', 
                        'brand-accent': '#C5A086', 
                        'brand-dark': '#5D534A',
                        'nav-active': '#A89080' 
                    },
                    fontFamily: { 
                        'sans': ['"Zen Maru Gothic"', 'sans-serif'], 
                        'serif': ['"Zen Maru Gothic"', 'sans-serif'], 
                        'hand': ['"Dancing Script"', 'cursive'] 
                    },
                    boxShadow: {
                        'nav': '0 -4px 20px rgba(0,0,0,0.05)'
                    }
                }
            }
        }

        // 🔧 後台設定區
        const SITE_CONFIG = {
            bookingLink: "https://liff.line.me/2005658992-1YnkbR7K", // 你的預約連結
            artists: {
                chloe: {
                    name: "Chloe",
                    title: "店長 / 資深設計師",
                    desc: "擅長精緻暈染、高質感造型",
                    // 這裡放 Chloe 的照片 (沿用之前的聖誕款或日常作品)
                    images: ["dec_2.jpg", "dec_1.jpg", "dec_3.jpg", "chloe_4.jpg", "chloe_5.jpg"] 
                },
                qiqi: {
                    name: "奇奇",
                    title: "人氣美甲師",
                    desc: "擅長日系小清新、可愛手繪風格",
                    // 這裡放 奇奇 的 5 張照片
                    images: ["qiqi_1.jpg", "qiqi_2.jpg", "qiqi_3.jpg", "qiqi_4.jpg", "qiqi_5.jpg"]
                }
            }
        };
    </script>
    <style>
        body { background-color: #F5F0F0; color: #8B7E74; font-family: "Zen Maru Gothic", sans-serif; padding-bottom: 100px; /* 留給底部導航的空間 */ }
        
        /* 圖片燈箱 */
        .zoomable { cursor: zoom-in; transition: transform 0.3s ease; } .zoomable:hover { transform: scale(1.02); }
        #lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); z-index: 9999; justify-content: center; align-items: center; }
        #lightbox.show { display: flex; } #lightbox img { max-width: 100%; max-height: 95vh; }

        /* 切換動畫 */
        .section-view { display: none; animation: fadeIn 0.4s ease-out; }
        .section-view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* 底部導航圖標樣式 */
        .nav-icon-btn { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; width: 33%; cursor: pointer; position: relative; color: #C5A086; transition: color 0.3s; }
        .nav-icon-btn.active { color: #5D534A; font-weight: bold; }
        .nav-icon-btn span { font-size: 14px; margin-top: 4px; }
        
        /* 中間凸起按鈕樣式 */
        .center-btn-wrapper { position: relative; top: -20px; }
        .center-btn { 
            width: 60px; height: 60px; 
            background-color: #C5A086; 
            border-radius: 50%; 
            display: flex; justify-content: center; align-items: center; 
            box-shadow: 0 4px 10px rgba(197, 160, 134, 0.4);
            color: white;
            transition: transform 0.2s;
        }
        .center-btn:active { transform: scale(0.95); }
        
    </style>
</head>
<body>

    <div id="lightbox" onclick="this.classList.remove('show')"><img id="lightbox-img" src=""></div>

    <header class="bg-white/80 backdrop-blur-md border-b border-gray-100 py-4 sticky top-0 z-30 text-center">
        <h1 class="text-2xl font-serif font-bold text-brand-dark tracking-wider">Chloe Nail Studio</h1>
        <p class="text-sm text-brand-accent font-hand" id="header-subtitle">Select Artist</p>
    </header>

    <main class="max-w-3xl mx-auto px-4 pt-6">
        
        <div id="view-chloe" class="section-view active">
            <div class="flex items-center gap-4 mb-6 bg-white p-4 rounded-xl shadow-sm border border-brand-accent/20">
                <div class="w-16 h-16 bg-brand-bg rounded-full flex items-center justify-center text-2xl overflow-hidden">
                    👩🏻‍🎨
                </div>
                <div>
                    <h2 class="text-xl font-bold text-brand-dark">Chloe</h2>
                    <p class="text-xs text-brand-accent">店長 / 資深美甲師</p>
                    <p class="text-sm text-gray-500 mt-1">擅長精緻暈染、高質感造型</p>
                </div>
            </div>
            
            <h3 class="text-lg font-bold mb-4 text-brand-dark pl-2 border-l-4 border-brand-accent">Portfolio 作品集</h3>
            <div class="grid grid-cols-2 gap-3" id="gallery-chloe">
                </div>
        </div>

        <div id="view-qiqi" class="section-view">
             <div class="flex items-center gap-4 mb-6 bg-white p-4 rounded-xl shadow-sm border border-brand-accent/20">
                <div class="w-16 h-16 bg-brand-bg rounded-full flex items-center justify-center text-2xl overflow-hidden">
                    👧🏻
                </div>
                <div>
                    <h2 class="text-xl font-bold text-brand-dark">奇奇 (Qiqi)</h2>
                    <p class="text-xs text-brand-accent">人氣美甲師</p>
                    <p class="text-sm text-gray-500 mt-1">擅長日系小清新、可愛手繪風格</p>
                </div>
            </div>

            <h3 class="text-lg font-bold mb-4 text-brand-dark pl-2 border-l-4 border-brand-accent">Portfolio 作品集</h3>
            <div class="grid grid-cols-2 gap-3" id="gallery-qiqi">
                </div>
        </div>

    </main>

    <nav class="fixed bottom-0 left-0 w-full bg-white border-t border-gray-100 shadow-nav z-40 h-[80px] flex justify-between items-end px-6 pb-2">
        
        <div class="nav-icon-btn active" id="btn-chloe" onclick="switchArtist('chloe')">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <path d="M16 10a4 4 0 0 1-8 0"></path>
            </svg>
            <span>Chloe</span>
        </div>

        <div class="nav-icon-btn" onclick="openBooking()">
            <div class="center-btn-wrapper">
                <div class="center-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                </div>
            </div>
            <span class="font-bold text-brand-dark">點我預約</span>
        </div>

        <div class="nav-icon-btn" id="btn-qiqi" onclick="switchArtist('qiqi')">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
            </svg>
            <span>奇奇</span>
        </div>

    </nav>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            renderGalleries();
        });

        function renderGalleries() {
            // 渲染 Chloe 的照片
            const chloeContainer = document.getElementById('gallery-chloe');
            if (SITE_CONFIG.artists.chloe.images.length > 0) {
                chloeContainer.innerHTML = SITE_CONFIG.artists.chloe.images.map(img => 
                    `<div class="aspect-[3/4] rounded-lg overflow-hidden shadow-sm bg-gray-100 relative group">
                        <img src="${img}" onclick="openLightbox(this.src)" class="w-full h-full object-cover zoomable" onerror="this.src='https://via.placeholder.com/400x600?text=Chloe+Work'">
                    </div>`
                ).join('');
            } else {
                chloeContainer.innerHTML = '<p class="col-span-2 text-center text-gray-400 py-10">尚無作品照片</p>';
            }

            // 渲染 奇奇 的照片
            const qiqiContainer = document.getElementById('gallery-qiqi');
            if (SITE_CONFIG.artists.qiqi.images.length > 0) {
                qiqiContainer.innerHTML = SITE_CONFIG.artists.qiqi.images.map(img => 
                    `<div class="aspect-[3/4] rounded-lg overflow-hidden shadow-sm bg-gray-100 relative group">
                        <img src="${img}" onclick="openLightbox(this.src)" class="w-full h-full object-cover zoomable" onerror="this.src='https://via.placeholder.com/400x600?text=Qiqi+Work'">
                    </div>`
                ).join('');
            } else {
                qiqiContainer.innerHTML = '<p class="col-span-2 text-center text-gray-400 py-10">尚無作品照片</p>';
            }
        }

        function switchArtist(artistId) {
            // 隱藏所有視圖
            document.querySelectorAll('.section-view').forEach(el => el.classList.remove('active'));
            // 移除導航激活狀態
            document.getElementById('btn-chloe').classList.remove('active');
            document.getElementById('btn-qiqi').classList.remove('active');

            // 顯示目標視圖
            document.getElementById(`view-${artistId}`).classList.add('active');
            document.getElementById(`btn-${artistId}`).classList.add('active');
            
            // 更新副標題
            const subtitle = artistId === 'chloe' ? "Design by Chloe" : "Design by Qiqi";
            document.getElementById('header-subtitle').innerText = subtitle;

            window.scrollTo(0,0);
        }

        function openBooking() {
            window.location.href = SITE_CONFIG.bookingLink;
        }

        function openLightbox(src){ 
            document.getElementById('lightbox-img').src=src; 
            document.getElementById('lightbox').classList.add('show'); 
        }
    </script>
</body>
</html>
