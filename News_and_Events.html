<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chloe Nail Studio | 最新活動</title>
    <link rel="icon" href="favicon.png" type="image/png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 
                        'brand-bg': '#F5F0F0', 
                        'brand-text': '#8B7E74', 
                        'brand-accent': '#C5A086', 
                        'brand-white': '#FFFFFF', 
                        'brand-dark': '#5D534A' 
                    },
                    fontFamily: { 
                        'sans': ['"Zen Maru Gothic"', 'sans-serif'], 
                        'serif': ['"Zen Maru Gothic"', 'sans-serif'], 
                        'hand': ['"Dancing Script"', 'cursive'] 
                    }
                }
            }
        }

        // ★★★ 1. 這裡加入您的設定檔 ★★★
        const SITE_CONFIG = {
            bookingLink: "https://liff.line.me/2005658992-1YnkbR7K",
            
            // 預約前要跳出的圖片 (請確認檔名正確)
            previewImages: [
                "rules.jpg"   
            ]
        };
    </script>

    <style>
        body { 
            background-color: #F5F0F0; 
            color: #8B7E74; 
            font-family: "Zen Maru Gothic", sans-serif; 
        }
        
        /* 淡入動畫 */
        .fade-in { animation: fadeIn 0.6s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* 圖片放大效果 */
        .zoomable { cursor: zoom-in; transition: transform 0.3s ease; } 
        .zoomable:hover { transform: scale(1.02); }
        
        /* Lightbox */
        #lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); z-index: 9999; justify-content: center; align-items: center; }
        #lightbox.show { display: flex; } 
        #lightbox img { max-width: 100%; max-height: 95vh; object-fit: contain; }

        /* ★★★ 新增：預約預覽視窗動畫 ★★★ */
        #booking-preview-modal.animation-fade-in { animation: fadeIn 0.3s ease-out; }
    </style>
</head>
<body class="pb-28">

    <div id="lightbox" onclick="this.classList.remove('show')">
        <img id="lightbox-img" src="">
    </div>

    <div id="booking-preview-modal" class="fixed inset-0 z-[100] bg-black/90 hidden items-center justify-center p-4 backdrop-blur-sm animation-fade-in">
        <div class="bg-white rounded-xl shadow-2xl max-w-md w-full overflow-hidden flex flex-col max-h-[90vh]">
            
            <div class="p-4 bg-brand-bg border-b border-gray-100 flex justify-between items-center">
                <h3 class="font-bold text-brand-dark text-lg">預約前請確認</h3>
                <button onclick="closeBookingPreview()" class="text-gray-400 hover:text-gray-600 text-xl font-bold px-2">✕</button>
            </div>

            <div id="preview-images-container" class="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-50">
                </div>

            <div class="p-4 bg-white border-t border-gray-100">
                <p class="text-center text-xs text-gray-500 mb-3">確認以上資訊沒問題後，將為您跳轉至 LINE 預約</p>
                <button onclick="realBookingAction()" class="w-full bg-brand-accent text-white py-3 rounded-full hover:bg-brand-dark transition font-bold tracking-widest shadow-lg transform active:scale-95 flex items-center justify-center gap-2">
                    前往預約
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5l7 7-7 7"></path></svg>
                </button>
            </div>
        </div>
    </div>

    <nav class="bg-brand-bg/95 backdrop-blur-sm border-b border-brand-accent/20 py-5 shadow-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-6 flex justify-center items-center">
            <div class="text-center">
                <div class="text-2xl font-bold tracking-widest font-serif text-brand-text">CHLOE NAIL</div>
                <div class="font-hand text-lg text-brand-accent">Chloe nail studio</div>
            </div>
        </div>
    </nav>

    <main class="py-16 min-h-screen fade-in">
        <div class="max-w-7xl mx-auto px-6">
            
            <div class="text-center mb-12">
                <h2 class="text-3xl md:text-4xl text-brand-text font-bold">Latest News & Events</h2>
                <span class="block text-2xl font-hand text-brand-accent font-normal mt-3">最新活動及訊息</span>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                
                <div class="bg-white p-2 rounded shadow-sm hover:shadow-md transition">
                    <img src="news_move.jpg" onclick="openLightbox(this.src)" class="w-full h-auto rounded zoomable aspect-[4/5] object-cover" onerror="this.src='https://via.placeholder.com/600?text=Move'">
                    <div class="p-3 text-center"><h3 class="text-brand-dark font-bold">‼️搬遷公告‼️</h3></div>
                </div>
                <div class="bg-white p-2 rounded shadow-sm hover:shadow-md transition">
                    <img src="news_pedicure.jpg" onclick="openLightbox(this.src)" class="w-full h-auto rounded zoomable aspect-[4/5] object-cover" onerror="this.src='https://via.placeholder.com/600?text=Pedicure'">
                    <div class="p-3 text-center"><h3 class="text-brand-dark font-bold">🎉新增足部專區🎉</h3></div>
                </div>
                <div class="bg-white p-2 rounded shadow-sm hover:shadow-md transition">
                    <img src="news_gel.jpg" onclick="openLightbox(this.src)" class="w-full h-auto rounded zoomable aspect-[4/5] object-cover" onerror="this.src='https://via.placeholder.com/600?text=Gel'">
                    <div class="p-3 text-center"><h3 class="text-brand-dark font-bold">手足凝膠服務</h3></div>
                </div>
                <div class="bg-white p-2 rounded shadow-sm hover:shadow-md transition">
                    <img src="news_care.jpg" onclick="openLightbox(this.src)" class="w-full h-auto rounded zoomable aspect-[4/5] object-cover" onerror="this.src='https://via.placeholder.com/600?text=Care'">
                    <div class="p-3 text-center"><h3 class="text-brand-dark font-bold">凝膠加購保養</h3></div>
                </div>
                <div class="bg-white p-2 rounded shadow-sm hover:shadow-md transition">
                    <img src="news_value.jpg" onclick="openLightbox(this.src)" class="w-full h-auto rounded zoomable aspect-[4/5] object-cover" onerror="this.src='https://via.placeholder.com/600?text=VIP'">
                    <div class="p-3 text-center"><h3 class="text-brand-dark font-bold">VIP 加值服務</h3></div>
                </div>
                <div class="bg-white p-2 rounded shadow-sm hover:shadow-md transition">
                    <img src="news_promo.jpg" onclick="openLightbox(this.src)" class="w-full h-auto rounded zoomable aspect-[4/5] object-cover" onerror="this.src='https://via.placeholder.com/600?text=Promo'">
                    <div class="p-3 text-center"><h3 class="text-brand-dark font-bold">優惠活動</h3></div>
                </div>
                <div class="bg-white p-2 rounded shadow-sm hover:shadow-md transition">
                    <img src="news_winter.jpg" onclick="openLightbox(this.src)" class="w-full h-auto rounded zoomable aspect-[4/5] object-cover" onerror="this.src='https://via.placeholder.com/600?text=Winter'">
                    <div class="p-3 text-center"><h3 class="text-brand-dark font-bold">冬季深層保養</h3></div>
                </div>

            </div>
        </div>
    </main>

    <footer class="bg-brand-bg border-t border-brand-accent/20 py-8 mt-8 text-center text-sm text-brand-text/60">
        <p>© 2026 Chloe Nail Studio. All rights reserved.</p>
    </footer>

    <div onclick="openBookingPreview()" class="fixed bottom-0 left-0 w-full bg-white/95 backdrop-blur-md border-t border-brand-accent/30 py-3 z-50 flex flex-col items-center justify-center text-brand-dark shadow-[0_-4px_15px_rgba(0,0,0,0.1)] hover:bg-brand-bg transition cursor-pointer group">
        <div class="w-14 h-14 rounded-full bg-brand-accent flex items-center justify-center shadow-md mb-1 group-hover:scale-105 transition-transform">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-7 h-7 text-white">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 9v7.5M10 12h4v4h-4v-4Z" />
            </svg>
        </div>
        <div class="text-base font-bold tracking-wider text-brand-dark">點我預約</div>
    </div>

    <script>
        // Lightbox 功能
        function openLightbox(src){ 
            document.getElementById('lightbox-img').src = src; 
            document.getElementById('lightbox').classList.add('show'); 
        }

        // ★★★ 4. 新增：控制預約預覽視窗的 JS ★★★
        
        // 開啟視窗
        function openBookingPreview() {
            const container = document.getElementById('preview-images-container');
            // 清空舊內容
            container.innerHTML = ''; 
            
            // 讀取設定檔圖片並插入
            SITE_CONFIG.previewImages.forEach(imgSrc => {
                const img = document.createElement('img');
                img.src = imgSrc;
                img.className = "w-full rounded-lg shadow-sm object-cover";
                // 萬一圖片讀不到，顯示替代圖
                img.onerror = function() { this.src='https://via.placeholder.com/400x600?text=Image+Missing'; };
                container.appendChild(img);
            });

            // 顯示視窗
            const modal = document.getElementById('booking-preview-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.body.style.overflow = 'hidden'; // 禁止背景捲動
        }

        // 關閉視窗
        function closeBookingPreview() {
            const modal = document.getElementById('booking-preview-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.body.style.overflow = 'auto'; // 恢復背景捲動
        }

        // 真正的跳轉動作
        function realBookingAction() {
            window.location.href = SITE_CONFIG.bookingLink;
        }
    </script>
</body>
</html>
