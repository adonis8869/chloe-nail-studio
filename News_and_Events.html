<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chloe Nail Studio | 最新活動</title>
    <link rel="icon" href="favicon.png" type="image/png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 
                        'brand-bg': '#F5F0F0', 
                        'brand-text': '#8B7E74', 
                        'brand-accent': '#C5A086', 
                        'brand-white': '#FFFFFF', 
                        'brand-dark': '#5D534A' 
                    },
                    fontFamily: { 
                        'sans': ['"Zen Maru Gothic"', 'sans-serif'], 
                        'serif': ['"Zen Maru Gothic"', 'sans-serif'], 
                        'hand': ['"Dancing Script"', 'cursive'] 
                    }
                }
            }
        }
    </script>

    <style>
        body { 
            background-color: #F5F0F0; 
            color: #8B7E74; 
            font-family: "Zen Maru Gothic", sans-serif; 
        }
        
        /* 淡入動畫 */
        .fade-in { animation: fadeIn 0.6s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* 圖片放大效果 */
        .zoomable { cursor: zoom-in; transition: transform 0.3s ease; } 
        .zoomable:hover { transform: scale(1.02); }
        
        /* Lightbox */
        #lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); z-index: 9999; justify-content: center; align-items: center; }
        #lightbox.show { display: flex; } 
        #lightbox img { max-width: 100%; max-height: 95vh; object-fit: contain; }
    </style>
</head>
<body>

    <div id="lightbox" onclick="this.classList.remove('show')">
        <img id="lightbox-img" src="">
    </div>

    <nav class="bg-brand-bg/95 backdrop-blur-sm border-b border-brand-accent/20 py-5 shadow-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-6 flex justify-between items-center">
            <div class="cursor-pointer" onclick="window.location.href='202512.html'"> <div class="text-2xl font-bold tracking-widest font-serif text-brand-text">CHLOE NAIL</div>
                <div class="font-hand text-lg text-brand-accent">Chloe nail studio</div>
            </div>
            <a href="202512.html" class="hidden md:block text-brand-accent hover:text-brand-dark transition font-medium">
                ← 優惠款式
            </a>
        </div>
    </nav>

    <main class="py-16 min-h-screen fade-in">
        <div class="max-w-7xl mx-auto px-6">
            
            <div class="text-center mb-12">
                <h2 class="text-3xl md:text-4xl text-brand-text font-bold">Latest News & Events</h2>
                <span class="block text-2xl font-hand text-brand-accent font-normal mt-3">最新活動及訊息</span>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                
                <div class="bg-white p-2 rounded shadow-sm hover:shadow-md transition relative group overflow-hidden">
                    <img src="news_pedicure.jpg" onclick="openLightbox(this.src)" class="w-full h-auto rounded zoomable aspect-[4/5] object-cover" alt="新增足部專區" onerror="this.src='https://via.placeholder.com/600x800?text=News+Image'">
                    <div class="absolute bottom-0 left-0 right-0 bg-brand-bg/95 p-4 text-brand-dark font-bold text-xl rounded-b border-t-2 border-brand-accent">
                        🎉 新增足部專區
                        <span class="block text-sm font-normal text-brand-accent mt-1">提供更舒適專業的足部保養體驗</span>
                    </div>
                </div>

                <div class="bg-white p-2 rounded shadow-sm hover:shadow-md transition">
                    <img src="news_gel.jpg" onclick="openLightbox(this.src)" class="w-full h-auto rounded zoomable aspect-[4/5] object-cover" alt="手足凝膠服務" onerror="this.src='https://via.placeholder.com/600x800?text=News+Image'">
                    <div class="p-3 text-center">
                        <h3 class="text-brand-dark font-bold text-lg">手足凝膠服務</h3>
                        <p class="text-sm text-gray-500 mt-1">細緻呵護您的指尖</p>
                    </div>
                </div>

                <div class="bg-white p-2 rounded shadow-sm hover:shadow-md transition">
                    <img src="news_care.jpg" onclick="openLightbox(this.src)" class="w-full h-auto rounded zoomable aspect-[4/5] object-cover" alt="凝膠加購保養服務" onerror="this.src='https://via.placeholder.com/600x800?text=News+Image'">
                    <div class="p-3 text-center">
                        <h3 class="text-brand-dark font-bold text-lg">凝膠加購保養</h3>
                        <p class="text-sm text-gray-500 mt-1">搭配課程更優惠</p>
                    </div>
                </div>

                <div class="bg-white p-2 rounded shadow-sm hover:shadow-md transition">
                    <img src="news_winter.jpg" onclick="openLightbox(this.src)" class="w-full h-auto rounded zoomable aspect-[4/5] object-cover" alt="冬季深層保養" onerror="this.src='https://via.placeholder.com/600x800?text=News+Image'">
                    <div class="p-3 text-center">
                        <h3 class="text-brand-dark font-bold text-lg">冬季深層保養</h3>
                        <p class="text-sm text-gray-500 mt-1">滋潤乾燥肌膚</p>
                    </div>
                </div>
                
                <div class="bg-white p-2 rounded shadow-sm hover:shadow-md transition">
                    <img src="news_value.jpg" onclick="openLightbox(this.src)" class="w-full h-auto rounded zoomable aspect-[4/5] object-cover" alt="加值服務" onerror="this.src='https://via.placeholder.com/600x800?text=News+Image'">
                    <div class="p-3 text-center">
                        <h3 class="text-brand-dark font-bold text-lg">VIP 加值服務</h3>
                        <p class="text-sm text-gray-500 mt-1">會員專屬權益</p>
                    </div>
                </div>

                <div class="bg-white p-2 rounded shadow-sm hover:shadow-md transition">
                    <img src="news_promo.jpg" onclick="openLightbox(this.src)" class="w-full h-auto rounded zoomable aspect-[4/5] object-cover" alt="優惠活動" onerror="this.src='https://via.placeholder.com/600x800?text=News+Image'">
                    <div class="p-3 text-center">
                        <h3 class="text-brand-dark font-bold text-lg">本月限定活動</h3>
                        <p class="text-sm text-gray-500 mt-1">限時預約優惠</p>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <footer class="bg-brand-bg border-t border-brand-accent/20 py-8 mt-8 text-center text-sm text-brand-text/60">
        <p>© 2024 Chloe Nail Studio. All rights reserved.</p>
    </footer>

    <script>
        // 只保留 Lightbox 功能
        function openLightbox(src){ 
            document.getElementById('lightbox-img').src = src; 
            document.getElementById('lightbox').classList.add('show'); 
        }
    </script>
</body>
</html>
